<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="icon-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="icon-wing-l" x1="50" y1="70" x2="128" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="icon-wing-r" x1="206" y1="70" x2="128" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="icon-nexus" x1="110" y1="90" x2="146" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <g filter="url(#icon-glow)">
    <!-- Left Wing -->
    <path d="M123 152C123 152 97 155 77 141C60 129 53 109 49 88C56 98 66 104 80 105C65 92 63 74 64 59C74 71 88 79 103 80C94 69 93 56 96 44C108 60 119 74 124 95L123 152Z" 
          fill="url(#icon-wing-l)"/>
    
    <!-- Right Wing -->
    <path d="M133 152C133 152 159 155 179 141C196 129 203 109 207 88C200 98 190 104 176 105C191 92 193 74 192 59C182 71 168 79 153 80C162 69 163 56 160 44C148 60 137 74 132 95L133 152Z" 
          fill="url(#icon-wing-r)"/>

    <!-- Wing Highlights -->
    <path d="M96 44C105 57 114 70 120 89C119 80 116 71 111 63C107 55 102 49 96 44Z" fill="#FFFFFF" fill-opacity="0.45"/>
    <path d="M160 44C151 57 142 70 136 89C137 80 140 71 145 63C149 55 154 49 160 44Z" fill="#FFFFFF" fill-opacity="0.45"/>

    <!-- Lower Shaft -->
    <path d="M128 202L123 152H133L128 202Z" fill="#818CF8"/>

    <!-- Diamond Nexus Core -->
    <path d="M128 78L144 122L128 166L112 122L128 78Z" fill="url(#icon-nexus)"/>

    <!-- Core Quantum Ring & Center Spark -->
    <circle cx="128" cy="122" r="9" fill="#FFFFFF"/>
    <circle cx="128" cy="122" r="16" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5"/>

    <!-- Top Halo Star -->
    <polygon points="128,64 131,73 140,76 131,79 128,88 125,79 116,76 125,73" fill="#FFFFFF"/>
    
    <!-- Micro-sparks -->
    <polygon points="92,103 94,107 98,109 94,111 92,115 90,111 86,109 90,107" fill="#E0E7FF"/>
    <polygon points="164,103 166,107 170,109 166,111 164,115 162,111 158,109 162,107" fill="#E0E7FF"/>
  </g>
</svg>
