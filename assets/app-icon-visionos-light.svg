<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Light Spatial Shadows -->
    <filter id="light-spatial-shadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#475569" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#6366F1" flood-opacity="0.14"/>
    </filter>

    <filter id="light-core-glow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Clean Alabaster White Gradient -->
    <linearGradient id="light-bg-plate" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Light Specular Border -->
    <linearGradient id="light-specular-border" x1="80" y1="48" x2="432" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#C7D2FE"/>
      <stop offset="70%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="light-wing-left" x1="110" y1="160" x2="256" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="light-wing-right" x1="402" y1="160" x2="256" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>

    <radialGradient id="light-spatial-aura" cx="256" cy="240" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0E7FF" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#E0F2FE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="light-squircle-clip">
      <rect x="48" y="48" width="416" height="416" rx="104" ry="104"/>
    </clipPath>
  </defs>

  <rect x="48" y="48" width="416" height="416" rx="104" ry="104" fill="none" filter="url(#light-spatial-shadow)"/>

  <g clip-path="url(#light-squircle-clip)">
    <!-- Base Plate -->
    <rect x="48" y="48" width="416" height="416" fill="url(#light-bg-plate)"/>
    
    <!-- Spatial Grid Geometry -->
    <circle cx="256" cy="256" r="176" stroke="#94A3B8" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle cx="256" cy="256" r="120" stroke="#94A3B8" stroke-opacity="0.2" stroke-width="1.5"/>
    <circle cx="256" cy="256" r="70" stroke="#6366F1" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Subtle Radial Glow -->
    <rect x="48" y="48" width="416" height="416" fill="url(#light-spatial-aura)"/>

    <!-- Frosted Internal Card -->
    <rect x="68" y="68" width="376" height="376" rx="84" fill="#FFFFFF" fill-opacity="0.65" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="1.5"/>

    <!-- Winged AI Motif -->
    <g filter="url(#light-core-glow)">
      <!-- Left Wing -->
      <path d="M246 294C246 294 198 300 162 274C132 252 120 216 112 178C124 196 142 208 166 210C140 186 136 154 138 126C156 148 180 162 208 164C192 144 190 120 196 98C218 126 238 152 248 190L246 294Z" 
            fill="url(#light-wing-left)"/>
      
      <!-- Right Wing -->
      <path d="M266 294C266 294 314 300 350 274C380 252 392 216 400 178C388 196 370 208 346 210C372 186 376 154 374 126C356 148 332 162 304 164C320 144 322 120 316 98C294 126 274 152 264 190L266 294Z" 
            fill="url(#light-wing-right)"/>

      <!-- Diamond Core -->
      <path d="M256 160L286 240L256 320L226 240L256 160Z" fill="#1E293B"/>
      <path d="M256 180L276 240L256 300L236 240L256 180Z" fill="#6366F1"/>

      <!-- Inner Pulsing Node -->
      <circle cx="256" cy="240" r="14" fill="#FFFFFF"/>
      <circle cx="256" cy="240" r="26" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="2"/>

      <!-- Spark Accents -->
      <polygon points="256,134 262,150 278,156 262,162 256,178 250,162 234,156 250,150" fill="#4F46E5"/>
      <polygon points="190,204 193,212 201,215 193,218 190,226 187,218 179,215 187,212" fill="#3B82F6"/>
      <polygon points="322,204 325,212 333,215 325,218 322,226 319,218 311,215 319,212" fill="#3B82F6"/>
    </g>

    <!-- Top Specular Sheen -->
    <path d="M48 48C120 48 240 80 320 160C400 240 432 360 432 432L464 464V48H48Z" fill="#FFFFFF" fill-opacity="0.45"/>
  </g>

  <!-- Specular Outer Border -->
  <rect x="48" y="48" width="416" height="416" rx="104" ry="104" 
        fill="none" stroke="url(#light-specular-border)" stroke-width="3"/>
</svg>
