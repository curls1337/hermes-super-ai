<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <!-- Emblem Gradients -->
    <linearGradient id="logoWingLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="logoWingRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="logoGlassFacet" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="superAiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="frostBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <!-- Filters -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Optional Subdued Frosted Canvas Backing for Standalone Viewing -->
  <rect x="6" y="6" width="908" height="208" rx="28" ry="28" 
        fill="#0B0F19" fill-opacity="0.85" 
        stroke="url(#frostBorder)" stroke-width="1.5" />

  <!-- Ambient Glow Behind Emblem -->
  <circle cx="110" cy="110" r="70" fill="#0284C7" opacity="0.25" filter="url(#logoGlow)" />
  <circle cx="140" cy="110" r="60" fill="#7C3AED" opacity="0.2" filter="url(#logoGlow)" />

  <!-- ================= LEFT EMBLEM (WINGED PRISM) ================= -->
  <g transform="translate(10, 0)">
    <!-- Frosted Disc Housing -->
    <circle cx="110" cy="110" r="68" fill="#131B2E" fill-opacity="0.6" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    <circle cx="110" cy="110" r="58" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Left Wings -->
    <path d="M 110 56 C 94 72 48 90 36 122 C 30 138 38 152 52 153 C 65 154 80 136 98 120 C 104 114 110 108 110 104 Z" 
          fill="url(#logoWingLeft)" />
    <path d="M 110 70 C 88 88 52 110 44 136 C 54 140 70 132 86 116 C 100 102 108 90 110 86 Z" 
          fill="url(#logoWingLeft)" opacity="0.9" />

    <!-- Right Wings -->
    <path d="M 110 56 C 126 72 172 90 184 122 C 190 138 182 152 168 153 C 155 154 140 136 122 120 C 116 114 110 108 110 104 Z" 
          fill="url(#logoWingRight)" />
    <path d="M 110 70 C 132 88 168 110 176 136 C 166 140 150 132 134 116 C 120 102 112 90 110 86 Z" 
          fill="url(#logoWingRight)" opacity="0.9" />

    <!-- Center Spatial Diamond Core -->
    <polygon points="110,48 136,92 110,110 84,92" 
             fill="url(#logoGlassFacet)" 
             stroke="#FFFFFF" 
             stroke-width="1.2" />

    <polygon points="110,166 136,118 110,110 84,118" 
             fill="#312E81" 
             stroke="rgba(255, 255, 255, 0.4)" 
             stroke-width="1" />

    <!-- Core Spark -->
    <circle cx="110" cy="110" r="12" fill="#FFFFFF" filter="url(#logoGlow)" />
    <path d="M 110 92 L 112.5 107.5 L 128 110 L 112.5 112.5 L 110 128 L 107.5 112.5 L 92 110 L 107.5 107.5 Z" fill="#0F172A" />
  </g>

  <!-- ================= RIGHT WORDMARK & TYPOGRAPHY ================= -->
  <!-- "HERMES" Primary Brand Title -->
  <text x="210" y="112" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" 
        font-size="52" 
        font-weight="800" 
        letter-spacing="5" 
        fill="#F8FAFC">HERMES</text>

  <!-- Frosted Glass Pill Capsule for "SUPER AI" -->
  <g transform="translate(505, 68)">
    <rect x="0" y="0" width="225" height="52" rx="14" ry="14" 
          fill="#1E293B" fill-opacity="0.65" 
          stroke="url(#frostBorder)" stroke-width="1" />

    <!-- Subtle Inner Tint Glow -->
    <rect x="1" y="1" width="223" height="50" rx="13" ry="13" 
          fill="url(#superAiGrad)" fill-opacity="0.08" />

    <text x="112" y="34" 
          text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" 
          font-size="24" 
          font-weight="800" 
          letter-spacing="3" 
          fill="url(#superAiGrad)">SUPER AI</text>
  </g>

  <!-- Tagline / Subtitle -->
  <g transform="translate(212, 148)">
    <text x="0" y="0" 
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', sans-serif" 
          font-size="12.5" 
          font-weight="600" 
          letter-spacing="4.5" 
          fill="#94A3B8">SPATIAL MULTIMODAL SUITE</text>

    <!-- Separation Dot -->
    <circle cx="282" cy="-4" r="2.5" fill="#38BDF8" />

    <text x="296" y="0" 
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', sans-serif" 
          font-size="12.5" 
          font-weight="500" 
          letter-spacing="3.5" 
          fill="#64748B">VISIONOS FROST</text>
  </g>

  <!-- Version / Architecture Pill Badge on Far Right -->
  <g transform="translate(760, 76)">
    <rect x="0" y="0" width="124" height="34" rx="17" ry="17" 
          fill="#0F172A" fill-opacity="0.75" 
          stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <circle cx="18" cy="17" r="4" fill="#10B981" />
    <text x="66" y="22" 
          text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" 
          font-size="11" 
          font-weight="700" 
          letter-spacing="1.5" 
          fill="#E2E8F0">v1.0 HYBRID</text>
  </g>
</svg>
