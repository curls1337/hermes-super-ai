<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="favBg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Wing & Crystal Gradients -->
    <linearGradient id="favWingLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="favWingRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <linearGradient id="favFacet" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS-Style Squircle Background with Specular Rim -->
  <rect x="2" y="2" width="124" height="124" rx="28" ry="28" 
        fill="url(#favBg)" 
        stroke="rgba(255, 255, 255, 0.35)" 
        stroke-width="1.75" />

  <!-- Ambient Blue/Purple Back-Glow -->
  <circle cx="64" cy="64" r="38" fill="#0284C7" opacity="0.3" filter="url(#favGlow)" />
  <circle cx="76" cy="64" r="32" fill="#7C3AED" opacity="0.25" filter="url(#favGlow)" />

  <!-- Hermes Wing Left -->
  <path d="M 64 24 C 52 36 22 52 14 74 C 9 86 16 96 28 97 C 39 98 52 84 64 68 Z" 
        fill="url(#favWingLeft)" />
  
  <!-- Hermes Wing Right -->
  <path d="M 64 24 C 76 36 106 52 114 74 C 119 86 112 96 100 97 C 89 98 76 84 64 68 Z" 
        fill="url(#favWingRight)" />

  <!-- Central Spatial Prism Facet -->
  <polygon points="64,18 82,54 64,68 46,54" 
           fill="url(#favFacet)" 
           stroke="#FFFFFF" 
           stroke-width="1.5" 
           stroke-linejoin="round" />

  <!-- Lower Diamond Facet -->
  <polygon points="64,106 82,72 64,68 46,72" 
           fill="#312E81" 
           stroke="rgba(255, 255, 255, 0.45)" 
           stroke-width="1" 
           stroke-linejoin="round" />

  <!-- Center Core Glowing Spark -->
  <circle cx="64" cy="68" r="9" fill="#FFFFFF" filter="url(#favGlow)" />
  <circle cx="64" cy="68" r="4.5" fill="#0F172A" />

  <!-- 4-Point Tiny Light Glint -->
  <polygon points="64,52 66,66 80,68 66,70 64,84 62,70 48,68 62,66" fill="#FFFFFF" />
</svg>
